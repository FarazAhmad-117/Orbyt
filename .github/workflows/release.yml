name: Release images

# Publishes multi-arch images to GitHub Container Registry when a version tag is pushed
# (e.g. `git tag v0.1.0 && git push --tags`). NOTHING is published until then.
#
# After the FIRST publish, set each package (orbyt-api, orbyt-web) to "Public" under the repo's
# Packages settings so people can `docker pull` without logging in.
# Not yet run: verify on the first real tag (a pre-release tag such as v0.1.0-rc1 is a safe test).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/docker.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: orbyt-api, dockerfile: docker/api.Dockerfile }
          - { name: orbyt-web, dockerfile: docker/web.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
