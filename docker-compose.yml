# Dev infrastructure. Defaults are for LOCAL DEVELOPMENT ONLY (ports bound to 127.0.0.1).
# Override via .env (see .env.example). api/worker/web services are added in later phases.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbyt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbyt}
      POSTGRES_DB: ${POSTGRES_DB:-orbyt}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["apps"] # opt-in until the images are verified end to end
    build: { context: ., dockerfile: docker/api.Dockerfile }
    ports: ["127.0.0.1:${API_PORT:-3001}:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    profiles: ["apps"]
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }

# worker: added in Phase 2 together with the email/queue workers.

# Object storage: none yet. Official minio/minio images are no longer published on Docker Hub
# or Quay (plan §15 Q9). Default to local disk; add an S3-compatible service when attachments land.

volumes:
  pgdata:
  redisdata:
